name: 데이터 갱신·배포

# input/ 폴더에 엑셀을 올리거나 페이지를 고치면: 데이터 다시 만들기 → 저장소에 반영 → GitHub Pages 배포
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 패키지 설치
        run: pip install pandas openpyxl

      - name: 엑셀 → 대시보드 데이터(data/)
        run: python scripts/build_all.py

      - name: 바뀐 데이터 저장소에 반영
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "데이터 변경 없음"
          else
            git commit -m "데이터 자동 갱신"
            git push
          fi

      - name: 배포할 파일 모으기
        run: |
          mkdir -p _site
          cp -r index.html assets data _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
